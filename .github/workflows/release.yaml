name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CHART_REPO: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  image:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

  chart:
    needs: image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin image digest in chart values
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          sed -i "s|^    digest: \"\"|    digest: \"${DIGEST}\"|" deploy/helm/values.yaml
          grep -q "digest: \"${DIGEST}\"" deploy/helm/values.yaml

      - name: Package chart
        run: |
          helm package deploy/helm \
            --version "${GITHUB_REF_NAME#v}" \
            --app-version "${GITHUB_REF_NAME}" \
            --destination dist

      - name: Push chart
        id: push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push dist/synology-csi-*.tgz "oci://${CHART_REPO}" 2>&1 | tee push.log
          echo "digest=$(awk '/^Digest:/ {print $2}' push.log)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign chart
        run: |
          test -n "${{ steps.push.outputs.digest }}"
          cosign sign --yes "${CHART_REPO}/synology-csi@${{ steps.push.outputs.digest }}"

  release:
    needs: [image, chart]
    runs-on: ubuntu-24.04

    permissions:
      contents: write # create the GitHub release

    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          cat > notes.md <<NOTES
          Image: \`${IMAGE}:${GITHUB_REF_NAME}\`
          Digest: \`${DIGEST}\`
          Chart: \`oci://${CHART_REPO}/synology-csi\` version \`${GITHUB_REF_NAME#v}\`
          NOTES
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --notes-file notes.md
