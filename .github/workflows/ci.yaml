name: CI
on:
  push:
    paths:
      - '.github/workflows/ci.yaml'
      - 'go.*'
      - '**/*.go'
      - 'Dockerfile'
      - 'Makefile'
  pull_request:
    paths:
      - '.github/workflows/ci.yaml'
      - 'go.*'
      - '**/*.go'
      - 'Dockerfile'
      - 'Makefile'

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@v6.1.0
        with:
          go-version-file: 'go.mod'

      - name: Build binary
        run: make build

      - name: Unit tests
        run: go test ./pkg/...
